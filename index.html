<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta

      content="Log delivery shifts and compare apps by what you really keep after gas."

    <script>
      // Apply the saved theme before the first paint (dark by default).
      try {
        if (localStorage.getItem("theme") !== "light") document.documentElement.classList.add("dark");
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
